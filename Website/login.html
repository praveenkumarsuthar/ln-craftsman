<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LN Craftsman</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; background:#111;">

<form id="loginForm" style="background:white; padding:30px; border-radius:10px; width:300px;">
    <h2 style="text-align:center;">Admin Login</h2>

    <input type="text" id="username" placeholder="Username" required><br><br>
    <input type="password" id="password" placeholder="Password" required><br><br>

    <button class="btn" style="width:100%;">Login</button>
</form>

<script src="js/script.js"></script>
</body>
</html>
